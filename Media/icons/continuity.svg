<!-- Custom NexusPC icon: no "infinity"/continuity glyph exists in Microsoft's
     Fluent UI System Icons set (checked: neither "Infinite" nor "Infinity"
     resolve in the assets tree), so this one is hand-authored rather than
     sourced. Matches the other icons' 24x24 viewBox and #212121 default fill
     convention so the same load-time recolor step applies uniformly; unlike
     the sourced icons (filled paths), this uses a stroke to keep two clean
     interlocking rings - a recovery/continuity motif - simple and reliable
     to render correctly without hand-derived bezier curves. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="8.5" cy="12" r="4.25" stroke="#212121" stroke-width="1.6"/>
<circle cx="15.5" cy="12" r="4.25" stroke="#212121" stroke-width="1.6"/>
</svg>
