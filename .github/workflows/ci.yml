name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows / MSVC / vcpkg
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Keep in sync with builtin-baseline in vcpkg.json.
          vcpkgGitCommitId: "04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4"

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  build-test-desktop:
    name: Windows / MSVC / vcpkg / Qt desktop
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Keep in sync with builtin-baseline in vcpkg.json.
          vcpkgGitCommitId: "04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4"

      # Keep the version/arch in sync with README's Prerequisites table.
      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtcharts"
          cache: "true"

      - name: Configure
        run: cmake --preset windows-msvc
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Debug)
        run: cmake --build --preset debug

      # Covers the desktop app and desktop_selftest, which the fast
      # backend-only build-test job above never touches (NEXUSPC_BUILD_DESKTOP
      # is off there so it can skip installing Qt).
      - name: Test
        run: ctest --preset debug

  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-18
          find libs apps tests modules app_services -type f \
            \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null \
            | xargs --no-run-if-empty clang-format-18 --dry-run --Werror
